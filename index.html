<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factoring Master Pro</title>
  <style>
    :root {
      --primary: #4A90E2;
      --bg: #F8FAFC;
      --text: #1E293B;
      --border: #CBD5E1;
      --math-font: 'Times New Roman', serif;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .game-card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 400px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .lvl-label {
      font-weight: 800;
      color: var(--primary);
    }

    .problem-display {
      background: #1E293B;
      color: #F8FAFC;
      font-size: 1.5rem;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 24px;
      font-family: var(--math-font);
      font-style: italic;
    }

    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .mode-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* --- たすき掛けエリア --- */
    .tasuki-container {
      position: relative;
      display: grid;
      /* [Input+x] [Spacer] [Input] [→] [Result] */
      grid-template-columns: 90px 40px 60px 30px 90px;
      /* 1行目(50px) / たすき空間(60px) / 2行目(50px) */
      grid-template-rows: 50px 60px 50px 20px 40px;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* 上下中央を合わせるためのSVG調整 */
    .tasuki-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 160px;
      /* 計算行より上のエリア（50+60+50）に限定 */
      pointer-events: none;
      z-index: 1;
    }

    .formula-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 220px;
      font-family: var(--math-font);
      font-size: 1.4rem;
      margin-bottom: 20px;
    }

    .formula-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .input-box {
      width: 50px;
      height: 48px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
      position: relative;
    }

    .input-box.active {
      border-color: var(--primary);
      background: #F0F7FF;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
    }

    .math-label {
      font-family: var(--math-font);
      font-style: italic;
      font-size: 1.3rem;
      z-index: 10;
    }

    .calc-res {
      font-family: var(--math-font);
      font-style: italic;
      font-weight: bold;
      text-align: center;
      font-size: 1.1rem;
    }

    .hr-line {
      grid-column: 1 / 6;
      border-top: 2px solid var(--text);
      margin: 8px 0;
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 40px;
    }

    .btn {
      border: none;
      background: #F1F5F9;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:active {
      background: #E2E8F0;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      grid-column: span 2;
    }

    .fs-btn-in {
      position: static;
      right: 16px;
      bottom: 16px;
      background: none;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
      color: #94A3B8;
      max-width: 100px;
      margin-right: 16px;
    }

    .status-msg {
      text-align: center;
      height: 24px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    @keyframes shake {

      10%,
      90% {
        transform: translate3d(-1px, 0, 0);
      }

      20%,
      80% {
        transform: translate3d(2px, 0, 0);
      }

      30%,
      50%,
      70% {
        transform: translate3d(-4px, 0, 0);
      }

      40%,
      60% {
        transform: translate3d(4px, 0, 0);
      }
    }
  </style>
</head>

<body>

  <div class="game-card" id="game-card">
    <div class="header">
      <span class="lvl-label" id="lvl-text">Lv.2</span>
      <select id="lvl-select" onchange="newGame()">
            <option value="1">Lv.1 (Basic)</option>
            <option value="2" selected>Lv.2 (Standard)</option>
            <option value="3">Lv.3 (Advanced)</option>
        </select>
    </div>

    <div class="mode-selector">
      <button id="mode-tasuki" class="mode-btn active" onclick="setMode('tasuki')">Cross Method</button>
      <button id="mode-formula" class="mode-btn" onclick="setMode('formula')">Formula Mode</button>
    </div>

    <div class="problem-display" id="display-eq">...</div>
    <div class="status-msg" id="msg"></div>

    <div class="tasuki-container" id="layout-tasuki">
      <svg class="tasuki-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line x1="15" y1="15" x2="57" y2="85" stroke="#94A3B8" stroke-width="0.8" />
        <line x1="15" y1="85" x2="57" y2="15" stroke="#94A3B8" stroke-width="0.8" />
      </svg>

      <div style="display:flex; align-items:center; gap:4px; z-index:10; justify-content: center;">
        <div class="input-box active" id="p" onclick="setFocus('p')"></div>
        <span class="math-label">x</span>
      </div>
      <div></div>
      <div class="input-box" id="q" style="margin: 0 auto;" onclick="setFocus('q')"></div>
      <div class="math-label">→</div>
      <div class="calc-res" id="hint-rq"></div>

      <div style="grid-column: span 5; height: 60px;"></div>

      <div style="display:flex; align-items:center; gap:4px; z-index:10; justify-content: center;">
        <div class="input-box" id="r" onclick="setFocus('r')"></div>
        <span class="math-label">x</span>
      </div>
      <div></div>
      <div class="input-box" id="s" style="margin: 0 auto;" onclick="setFocus('s')"></div>
      <div class="math-label">→</div>
      <div class="calc-res" id="hint-ps"></div>

      <div class="hr-line"></div>
      <div class="calc-res" id="hint-a"></div>
      <div></div>
      <div class="calc-res" id="hint-c"></div>
      <div class="math-label">→</div>
      <div class="calc-res" id="hint-b" style="color:var(--primary)"></div>
    </div>

    <div class="formula-container" id="layout-formula">
      <div class="formula-row">
        ( <div class="input-box" id="p2" onclick="setFocus('p2')"></div> <span class="math-label">x</span>
        + <div class="input-box" id="q2" onclick="setFocus('q2')"></div> )
      </div>
      <div style="height: 20px;"></div>
      <div class="formula-row">
        ( <div class="input-box" id="r2" onclick="setFocus('r2')"></div> <span class="math-label">x</span>
        + <div class="input-box" id="s2" onclick="setFocus('s2')"></div> )
      </div>
    </div>

    <div class="numpad">
      <button class="btn" onclick="typeIn('1')">1</button>
      <button class="btn" onclick="typeIn('2')">2</button>
      <button class="btn" onclick="typeIn('3')">3</button>
      <button class="btn" onclick="typeIn('4')">4</button>
      <button class="btn" onclick="typeIn('5')">5</button>
      <button class="btn" onclick="typeIn('6')">6</button>
      <button class="btn" onclick="typeIn('7')">7</button>
      <button class="btn" onclick="typeIn('8')">8</button>
      <button class="btn" onclick="typeIn('9')">9</button>
      <button class="btn" style="background:#CBD5E1" onclick="typeIn('-')">+/-</button>
      <button class="btn" onclick="typeIn('0')">0</button>
      <button class="btn" style="background:#CBD5E1" onclick="backspace()">BS</button>
      <button class="btn" style="background:#CBD5E1" onclick="clearAll()">C</button>
      <button class="btn btn-primary" onclick="submitAns()">Submit</button>
    </div>

    <div style="margin-top: 10px; text-align: center; font-size: 0.8rem; color: #64748B;">
      <input type="checkbox" id="show-hint" checked onchange="refreshCalc()">
      <label for="show-hint" style="cursor:pointer">Show calculation</label>
    </div>

    <button class="fs-btn-in" onclick="toggleFullScreen()">Full Screen</button>
    <p style="color: gray;">複製・転載禁止。作った友人に感謝</p>
  </div>

  <script>
    let activeId = 'p';
    let currentGoal = { a: 0, b: 0, c: 0 };
    let currentMode = 'tasuki';

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('layout-tasuki').style.display = mode === 'tasuki' ? 'grid' : 'none';
        document.getElementById('layout-formula').style.display = mode === 'formula' ? 'flex' : 'none';
        document.getElementById('mode-tasuki').classList.toggle('active', mode === 'tasuki');
        document.getElementById('mode-formula').classList.toggle('active', mode === 'formula');
        const baseId = activeId.replace('2', '');
        setFocus(mode === 'tasuki' ? baseId : baseId + '2');
    }

    function setFocus(id) {
        document.querySelectorAll('.input-box').forEach(b => b.classList.remove('active'));
        activeId = id;
        document.getElementById(id).classList.add('active');
    }

    function typeIn(v) {
        const el = document.getElementById(activeId);
        let val = el.innerText;
        // 符号反転ロジックを厳守
        if (v === '-') {
            if (val.startsWith('-')) el.innerText = val.substring(1);
            else el.innerText = '-' + val;
        } else {
            const digitLimit = val.startsWith('-') ? 4 : 3;
            if (val.length < digitLimit) el.innerText += v;
        }
        syncInputs();
        refreshCalc();
    }

    function syncInputs() {
        const baseId = activeId.replace('2', '');
        const targetId = activeId.includes('2') ? baseId : baseId + '2';
        const targetEl = document.getElementById(targetId);
        if (targetEl) targetEl.innerText = document.getElementById(activeId).innerText;
    }

    function backspace() {
        const el = document.getElementById(activeId);
        el.innerText = el.innerText.slice(0, -1);
        syncInputs();
        refreshCalc();
    }

    function clearAll() {
        ['p','q','r','s','p2','q2','r2','s2'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerText = "";
        });
        refreshCalc();
    }

    function refreshCalc() {
        const visible = document.getElementById('show-hint').checked;
        const p = parseInt(document.getElementById('p').innerText) || 0;
        const q = parseInt(document.getElementById('q').innerText) || 0;
        const r = parseInt(document.getElementById('r').innerText) || 0;
        const s = parseInt(document.getElementById('s').innerText) || 0;
        const set = (id, val, suffix = "") => {
            const el = document.getElementById(id);
            if (!visible) { el.innerText = "?" + suffix; return; }
            el.innerText = (isNaN(val) ? 0 : val) + suffix;
        };
        set('hint-rq', r * q, "x");
        set('hint-ps', p * s, "x");
        set('hint-b', (r * q) + (p * s), "x");
        set('hint-a', p * r, "x²");
        set('hint-c', q * s);
    }

    function newGame() {
        const lv = parseInt(document.getElementById('lvl-select').value);
        document.getElementById('lvl-text').innerText = "Lv." + lv;
        document.getElementById('msg').innerText = "";
        let p, q, r, s, a, b, c;
        const gcd = (x, y) => y === 0 ? x : gcd(y, x % y);
        while (true) {
            if (lv === 1) { p = 1; r = 1; q = rand(-5, 5); s = rand(-5, 5); }
            else if (lv === 2) { p = [2, 3, 5, 7][rand(0, 3)]; r = 1; q = rand(-6, 6); s = rand(-6, 6); }
            else { p = rand(2, 5); r = rand(2, 4); q = rand(-8, 8); s = rand(-8, 8); }
            if (q === 0 || s === 0 || (p*s + r*q) === 0) continue;
            if (gcd(Math.abs(p), Math.abs(q)) !== 1 || gcd(Math.abs(r), Math.abs(s)) !== 1) continue;
            a = p * r; c = q * s; b = p * s + r * q;
            break;
        }
        currentGoal = { a, b, c };
        const format = (n, x, isFirst) => {
            if (n === 0) return "";
            let sgn = n > 0 ? (isFirst ? "" : "+ ") : (isFirst ? "-" : "- ");
            let val = Math.abs(n) === 1 && x !== "" ? "" : Math.abs(n);
            return sgn + val + x + " ";
        };
        document.getElementById('display-eq').innerText = (format(a, "x²", true) + format(b, "x", false) + format(c, "", false)).trim();
        clearAll();
        setFocus(currentMode === 'tasuki' ? 'p' : 'p2');
    }

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function submitAns() {
        const p = parseInt(document.getElementById('p').innerText);
        const q = parseInt(document.getElementById('q').innerText);
        const r = parseInt(document.getElementById('r').innerText);
        const s = parseInt(document.getElementById('s').innerText);
        const msg = document.getElementById('msg');
        if ([p, q, r, s].some(isNaN)) {
            msg.innerText = "Please fill all boxes!";
            msg.style.color = "#EF4444";
            return;
        }
        const ok = (p*r === currentGoal.a && q*s === currentGoal.c && (p*s + r*q) === currentGoal.b) ||
                   (r*p === currentGoal.a && s*q === currentGoal.c && (r*q + p*s) === currentGoal.b);
        if (ok) {
            msg.innerText = "Correct! Great job.";
            msg.style.color = "#10B981";
            setTimeout(newGame, 1500);
        } else {
            msg.innerText = "Incorrect. Try again!";
            msg.style.color = "#EF4444";
            const card = document.getElementById('game-card');
            card.style.animation = 'shake 0.4s';
            setTimeout(() => card.style.animation = '', 400);
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
    }
    window.onload = newGame;
  </script>
</body>

</html>
